name: Generate NPKM

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Coni
        uses: ./.github/actions/setup-coni



      - name: Bootstrap NPKM
        run: |
          cd npkm-coni
          printf '%s' 'development' > build_date.txt
          coni build . -o npkm-coni
          chmod +x npkm-coni

      - name: Build and Package Release
        run: |
          ./npkm-coni/npkm-coni --verbose package_release.edn

      - name: Generate Security Reports for Release Notes
        uses: ./.github/actions/security-report
        with:
          binary_path: dist/npkm-coni-linux
          scan_dir: dist/
          output_file: release_notes.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: npkm-release
          path: dist/*.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.zip
          body_path: release_notes.md
          generate_release_notes: true
