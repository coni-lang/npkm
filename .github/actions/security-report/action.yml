name: "Security Report Generator"
description: "Generates a markdown security report containing govulncheck, ldd, and clamav scans."
inputs:
  binary_path:
    description: "Path to the compiled Linux binary to run ldd against"
    required: true
  scan_dir:
    description: "Directory to scan with ClamAV"
    required: true
  output_file:
    description: "Path to the output markdown file"
    required: true
    default: "release_notes.md"

runs:
  using: "composite"
  steps:
    - name: Install govulncheck
      shell: bash
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Cache ClamAV Database
      uses: actions/cache@v4
      with:
        path: ~/clamav-db
        key: clamav-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          clamav-db-${{ runner.os }}-

    - name: Install ClamAV
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y clamav
        sudo systemctl stop clamav-freshclam || true
        
        # If cache restored to ~/clamav-db, copy it to the system location
        if [ -d ~/clamav-db ] && [ "$(ls -A ~/clamav-db 2>/dev/null)" ]; then
            sudo cp -r ~/clamav-db/* /var/lib/clamav/ || true
            sudo chown -R clamav:clamav /var/lib/clamav || true
        fi
        
        # Let freshclam run normally (AppArmor allows writing to /var/lib/clamav)
        sudo freshclam || true
        
        # Copy updated databases back for caching
        mkdir -p ~/clamav-db
        sudo cp -r /var/lib/clamav/* ~/clamav-db/ || true
        sudo chown -R $USER:$USER ~/clamav-db || true

    - name: Generate Security Reports for Release Notes
      shell: bash
      run: |
        echo "## Security Audit & Guarantees" > ${{ inputs.output_file }}
        
        echo "### 1. Go Vulnerability Check (govulncheck)" >> ${{ inputs.output_file }}
        echo '```' >> ${{ inputs.output_file }}
        ~/go/bin/govulncheck -mode=binary $(which coni) >> ${{ inputs.output_file }} 2>&1 || true
        echo '```' >> ${{ inputs.output_file }}
        
        echo "### 2. Shared Library Dependencies (ldd)" >> ${{ inputs.output_file }}
        for bin in ${{ inputs.binary_path }}; do
            echo "#### $bin" >> ${{ inputs.output_file }}
            echo '```' >> ${{ inputs.output_file }}
            LDD_OUT=$(ldd $bin 2>&1 || true)
            if echo "$LDD_OUT" | grep -q "not a dynamic executable"; then
                echo "Statically linked (not a dynamic executable)" >> ${{ inputs.output_file }}
            else
                echo "$LDD_OUT" >> ${{ inputs.output_file }}
            fi
            echo '```' >> ${{ inputs.output_file }}
        done
        
        echo "### 3. Antivirus Scan (ClamAV)" >> ${{ inputs.output_file }}
        echo '```' >> ${{ inputs.output_file }}
        if [ -z "$(ls -A /var/lib/clamav 2>/dev/null | grep -v '\.$')" ] && [ -z "$(ls -A $HOME/clamav-db 2>/dev/null)" ]; then
            echo "ClamAV database not available (possibly due to rate limits or missing cache)." >> ${{ inputs.output_file }}
        else
            clamscan -r ${{ inputs.scan_dir }} >> ${{ inputs.output_file }} 2>&1 || true
        fi
        echo '```' >> ${{ inputs.output_file }}

